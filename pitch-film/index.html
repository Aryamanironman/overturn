  const ids = ['hook','reveal','reads','flip','proof','zetaris','agents','stats','missing','result','packet','close'];
  ids.forEach((id,i)=>{
    const el = document.getElementById('s-'+id);
    if(!el) return;
    const next = i < starts.length-1 ? starts[i+1] : TOTAL;
    const on = (i===ids.length-1) || (at >= starts[i]-0.35 && at < next+0.15);
    el.style.display = on ? 'flex' : 'none';
  });
}

const counter={v:0};
Object.defineProperty(counter,'v',{set:(v)=>{const n=document.getElementById('scorenum'); if(n) n.textContent=String(Math.round(v));}});
tl.fromTo(counter,{v:0},{v:SCORE,duration:1.0,ease:'power2.out',immediateRender:false},T.score+0.15);
tl.fromTo(qa('stats','.hb'),{autoAlpha:0,y:8,scale:.9},{autoAlpha:1,y:0,scale:1,duration:0.14,stagger:0.012,ease:'none'},T.ledger);
tl.fromTo(q('stats','.hhead'),{autoAlpha:0},{autoAlpha:1,duration:0.4},T.ledger+0.35);
tl.fromTo(q('stats','.humanstamp'),{autoAlpha:0,scale:1.4,rotation:-7},{autoAlpha:1,scale:1,rotation:-2,duration:0.35,ease:'back.out(1.7)'},T.human);
tl.fromTo(q('stats','.reading'),{autoAlpha:0,y:14},{autoAlpha:1,y:0,duration:0.45,ease:'power2.out'},T.reading);

// 9 missing
cut('missing',T.missing);
tl.fromTo(q('missing','.doc'),{autoAlpha:0,y:30,rotation:-1.5},{autoAlpha:1,y:0,rotation:0,duration:0.5,ease:'expo.out'},T.missing);
tl.fromTo(q('missing','h2'),{autoAlpha:0,y:26},{autoAlpha:1,y:0,duration:0.45,ease:'expo.out'},T.missing+0.15);
tl.fromTo(q('missing','.bigstamp'),{autoAlpha:0,scale:1.5,rotation:-10},{autoAlpha:1,scale:1,rotation:-7,duration:0.4,ease:'back.out(1.7)'},T.invent+0.05);
tl.fromTo(q('missing','.note'),{autoAlpha:0},{autoAlpha:1,duration:0.4},T.invent+0.2);
tl.fromTo(q('missing','.action'),{autoAlpha:0,y:12},{autoAlpha:1,y:0,duration:0.4,ease:'back.out(1.5)'},T.get);

// 10 result 84 -> 100
cut('result',T.result);
const rnum=document.getElementById('resultnum');
tl.fromTo(q('result','.resultnum'),{autoAlpha:0,scale:.9},{autoAlpha:1,scale:1,duration:0.5,ease:'expo.out'},T.result);
const rc={v:0};
Object.defineProperty(rc,'v',{set:(v)=>{if(rnum) rnum.textContent=String(Math.round(v));}});
tl.fromTo(rc,{v:0},{v:SCORE,duration:0.9,ease:'power2.out',immediateRender:false},T.result);
tl.fromTo(q('result','.resultmeta'),{autoAlpha:0,y:20},{autoAlpha:1,y:0,duration:0.45,ease:'power2.out'},T.result+0.25);
tl.to(q('result','.resultnum'),{color:'#1b6b4a',duration:0.2},T.send-0.15);
const rc2={v:SCORE};
Object.defineProperty(rc2,'v',{set:(v)=>{if(rnum) rnum.textContent=String(Math.round(v));}});
tl.fromTo(rc2,{v:SCORE},{v:READY,duration:0.8,ease:'expo.out',immediateRender:false},T.send);
tl.fromTo(q('result','.resultnum'),{scale:1},{scale:1.06,duration:0.25,yoyo:true,repeat:1,ease:'power2.inOut'},T.send);
const rl=document.getElementById('resultlabel');
if(rl){ tl.to(rl,{autoAlpha:0,duration:0.15},T.send-0.1); tl.set(rl,{textContent:'Ready · 100'},T.send+0.05); tl.to(rl,{autoAlpha:1,duration:0.2},T.send+0.1); }

// 11 packet
cut('packet',T.packet);
tl.fromTo(q('packet','.receipt'),{autoAlpha:0,y:40,rotation:-4,scale:.94},{autoAlpha:1,y:0,rotation:-1.2,scale:1,duration:0.7,ease:'expo.out'},T.packet);
tl.fromTo(qa('packet','.pl'),{autoAlpha:0,x:-24},{autoAlpha:1,x:0,duration:0.4,stagger:0.35,ease:'power3.out'},T.packet+0.1);

// 12 close
cut('close',T.close);
tl.fromTo(q('close','.mark'),{autoAlpha:0,scale:1.08},{autoAlpha:1,scale:1,duration:0.8,ease:'expo.out'},T.close);
tl.fromTo(q('close','.mark'),{scale:1.03},{scale:1,duration:0.35,ease:'power2.out'},T.brand);
tl.fromTo(q('close','.sub'),{autoAlpha:0,y:18},{autoAlpha:1,y:0,duration:0.5,ease:'power2.out'},T.close+0.5);
tl.fromTo(qa('close','.sponsors span'),{autoAlpha:0,y:8},{autoAlpha:1,y:0,duration:0.3,stagger:0.08},T.close+0.8);
tl.to({},{duration:Math.max(HOLD,0.1)},TOTAL);

// one wipe on the biggest turn: proof -> zetaris
tl.set('#wipe',{scaleX:0,transformOrigin:'0 50%'},0);
tl.to('#wipe',{scaleX:1,duration:0.22,ease:'power2.in'},T.zetaris-0.24);
tl.to('#wipe',{scaleX:0,transformOrigin:'100% 50%',duration:0.24,ease:'power2.out'},T.zetaris+0.01);

// sound
OM.sfx('impact',0,{gain:0.9});
OM.sfx('stamp',0.9,{gain:0.8});
OM.sfx('whoosh',T.reveal,{gain:0.45});
OM.sfx('pop',T.reads+0.25,{gain:0.4});
OM.sfx('stamp',T.flip+1.35,{gain:0.75});
OM.sfx('thud',T.proof,{gain:0.6});
OM.sfx('thud',T.proof+0.45,{gain:0.5});
OM.sfx('thud',T.proof+0.9,{gain:0.5});
OM.sfx('riser',T.zetaris,{gain:0.5});
OM.sfx('pop',T.agents+0.2,{gain:0.4});
OM.sfx('count',T.score+0.2,{gain:0.45});
OM.sfx('stamp',T.invent,{gain:0.8});
OM.sfx('chime',T.get,{gain:0.5});
OM.sfx('impact',T.send,{gain:0.7});
OM.sfx('paper',T.packet,{gain:0.5});
OM.sfx('chime',T.close,{gain:0.6});

OM.music({
  product:'explainer', drop:'zetaris', ending:'button', bpm:104,
  energy:{hook:0.35,reveal:0.3,reads:0.55,flip:0.7,proof:0.65,zetaris:1.0,agents:0.8,stats:0.85,missing:0.4,result:0.95,packet:0.5,close:0.85}
});

tl.seek(0,false);
mount(0);
</script>

</body>
</html>
